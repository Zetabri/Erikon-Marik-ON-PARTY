<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>HitPlay App</title>
</head>
<body>

  <h1>🎵 HitPlay Casero</h1>

  <button onclick="nuevaPalabra()">Nueva palabra</button>
  <p id="palabra"></p>

  <script>
    const palabras = ["amor", "fiesta", "verano", "noche", "baile"];

    function nuevaPalabra() {
      const random = Math.floor(Math.random() * palabras.length);
      document.getElementById("palabra").textContent = palabras[random];
    }
  </script>

</body>
</html>
